name: Tests and container
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest --cov=gridflex --cov-report=term-missing --cov-report=xml
      - name: Audit pinned Python dependency closure
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements-dev.lock --no-deps --disable-pip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Docker build and real HTTP smoke test
        run: |
          docker build -t gridflex:test .
          docker run -d --name gridflex -p 8000:8000 gridflex:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/v1/forecast > /tmp/forecast.json
          python -c "import json; d=json.load(open('/tmp/forecast.json')); assert len(d['slots']) == 48 and d['mode'] == 'replay'"
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8000/api/v1/schedule
      - name: Dashboard integration against the container
        run: npm run test:ui
      - name: Container logs
        if: always()
        run: docker logs gridflex || true
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
      - working-directory: infra/terraform
        run: terraform init -backend=false && terraform fmt -check && terraform validate

  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: public-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: node --experimental-strip-types --test tests/grid.test.ts
      - run: pnpm build
