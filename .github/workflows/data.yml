name: Scheduled ingestion and monitoring
on:
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridflex-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-runtime.lock && pip install --no-deps -e .
      - name: Restore previously issued forecasts
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/issued
          key: gridflex-issued-${{ github.run_id }}
          restore-keys: gridflex-issued-
      - run: gridflex maintenance
      - name: Preserve issued forecasts for delayed-label scoring
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/issued
          key: gridflex-issued-${{ github.run_id }}
      - name: Publish auditable run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gridflex-data-${{ github.run_id }}
          path: |
            data/raw
            data/processed
            data/issued
          retention-days: 30
