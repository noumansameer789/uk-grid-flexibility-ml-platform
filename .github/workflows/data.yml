name: Scheduled ingestion and monitoring
on:
  schedule:
    - cron: "23 1,7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridflex-data
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-runtime.lock && pip install --no-deps -e .
      - name: Restore previously issued forecasts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/issued
          key: gridflex-issued-${{ github.run_id }}
          restore-keys: gridflex-issued-
      - run: gridflex maintenance
      - name: Preserve issued forecasts for delayed-label scoring
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/issued
          key: gridflex-issued-${{ github.run_id }}
      - name: Publish auditable run evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gridflex-data-${{ github.run_id }}
          path: |
            data/raw
            data/processed
            data/issued
          retention-days: 30
